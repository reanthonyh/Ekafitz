include: package:flutter_lints/flutter.yaml

plugins:
  riverpod_lint: 3.1.9

linter:
  rules:
    - prefer_single_quotes
    - avoid_print: false

analyzer:
  errors:
    invalid_annotation_target: ignore

  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
